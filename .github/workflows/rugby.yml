name: Update Rugby Data

on:
  workflow-dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  build:
  runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      - uses: actions/checkout@v3

      - name: setup R
      - uses: r-lib/actions/setup-r@v2
      - with:
          use-public-rspm: true
      - name: Package Installation
        uses: r-lib/actions/setup-r-dependencies@v2
        packages: |
            any::tidyverse
            any::rvest
            any::remotes
            any::piggyback
      - name: usportsR Installation
        run: Rscript -e 'remotes::install_github("uwaggs/usportsscraper")'

      - name: Update results
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'source(file.path("update", "update_rugby.R"), echo = TRUE)'
