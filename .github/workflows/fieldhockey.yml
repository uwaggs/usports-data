name: Update Field Hockey Data

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Package Installation
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::pacman
            any::remotes
            any::curl
      - name: usportsR Installation
        run: Rscript -e 'remotes::install_github("uwaggs/usportsscraper")'
        env:
          GITHUB_PAT: ${{ secrets.GH_TOKEN }}

      - name: Update results
        env:
          GITHUB_PAT: ${{ secrets.GH_TOKEN }}
        run: Rscript -e 'source(file.path("update", "update_fieldhockey.R"), echo = TRUE)'
