name: Update Track and Field Data

on:
  # push:
  #   branches:
  #     - main
  schedule:
    # - cron: "5 4 * * *" # This runs the workflow daily at midnight UTC

jobs:
  update-track-and-field:
    runs-on: ubuntu-latest
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      # RSPM: ${{ matrix.config.rspm }} No matrix defined yet. Could have one to run same scraping scripts on different sites.
      GITHUB_PAT: ${{ secrets.NBLR_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - uses: r-lib/actions/setup-r@v2
      - name: Package Installation
        run: Rscript -e 'install.packages(c("remotes", "dplyr", "purrr", "piggyback", "tidyr", "httr", "here"))'
      - name: usportsscraper Installation
        run: Rscript -e 'remotes::install_github("uwaggs/usportsscraper")'
      - name: Update Track and Field Data
        run: Rscript -e 'source(file.path("update", "update_track_and_field.R"), echo = TRUE)'