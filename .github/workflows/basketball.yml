name: Update Basketball Data

on:
  workflow-dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  update-basketball:
  runs-on: windows-latest
  env:
    R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - uses: r-lib/actions/setup-r@v2
      - name: Package Installation
        run: Rscript -e 'install.packages(c("dplyr", "purrr", "tidyr", "rvest", "lubridate"))'
      - name: usportsR Installation
        run: Rscript -e 'remotes::install_github("uwaggs/usportsscraper")'
      - name: Update results
        run: Rscript -e 'source(file.path("update", "update_basketball.R"), echo = TRUE)'
